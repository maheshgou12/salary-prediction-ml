[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "BLE", "DTZ", "RUF", "SIM", "ASYNC", "PLW"]
ignore = [
    "BLE001",   # blind except used intentionally for ML pipeline resilience
    "DTZ005",   # naive datetimes acceptable for local SQLite logging
    "RUF059",   # unpacked-but-unused variables kept for readability
    "RUF046",   # int(round(...)) kept for clarity
    "RUF005",   # list concatenation style
    "S110",     # try/except/pass used for optional group stats
    "S608",     # SQL is built from internal feature lists, not user input
    "ASYNC221", # subprocess retrain endpoint documented blocking behavior
    "PLW1510",
    "PLC0415",
    "PLW0603",
    "S101",
    "S104",
    "S607",
    "RUF001",
    "SIM108",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
