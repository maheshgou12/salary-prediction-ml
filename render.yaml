services:
  - type: web
    name: fairsalaryy-backend
    env: python
    rootDir: .
    buildCommand: pip install -r FairSalaryAI/backend/requirements.txt
    startCommand: cd FairSalaryAI/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite:///./fairsalary.db
      - key: SECRET_KEY
        value: "fairsalary-production-permanent-auth-token-secret-key-2026-v1"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "5256000"
      - key: FRONTEND_URL
        value: "https://salary-prediction-ml-ivory.vercel.app"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
