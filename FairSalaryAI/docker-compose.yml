version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fairsalary-postgres
    environment:
      POSTGRES_DB: fairsalary
      POSTGRES_USER: fairsalary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairsalary_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairsalary -d fairsalary"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fairsalary-backend
    environment:
      DATABASE_URL: postgresql://fairsalary:${POSTGRES_PASSWORD:-fairsalary_dev_password}@postgres:5432/fairsalary
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      BCRYPT_ROUNDS: 12
      FRONTEND_URL: http://localhost:5173
      MODEL_PATH: /app/ml/models/best_model.joblib
      MODEL_METADATA_PATH: /app/ml/models/metadata.json
      MODEL_VERSION: 1.0.0
      DEBUG: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fairsalary-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data: