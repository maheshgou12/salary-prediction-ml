name: FairPay CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  CACHE_KEY: fairpay-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ env.CACHE_KEY }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-cov

      - name: Run Ruff (linting)
        run: |
          ruff check src/ tests/ app/
          ruff format --check src/ tests/ app/

      - name: Run MyPy (type checking)
        run: |
          mypy src/ --ignore-missing-imports --strict-optional

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ env.CACHE_KEY }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Generate test data
        run: python data/generate_data.py

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing -n auto

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ env.CACHE_KEY }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate data
        run: python data/generate_data.py

      - name: Train model
        run: python src/train.py
        timeout-minutes: 10
        env:
          MLFLOW_DISABLE_AGENT_HINT: 1

      - name: Run fairness audit
        run: python src/fairness.py
        timeout-minutes: 5

      - name: Run conformal prediction
        run: python src/uncertainty.py
        timeout-minutes: 5

      - name: Run drift detection
        run: python src/drift.py
        timeout-minutes: 5

      - name: Verify model artifacts
        run: |
          test -f models/best_model.joblib
          test -f models/training_summary.json
          test -f models/fairness_audit.json
          test -f models/conformal_summary.json
          test -f models/drift_report.json

  model-validation:
    name: Model Validation
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-key: ${{ env.CACHE_KEY }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate model performance thresholds
        run: |
          python -c "
          import json
          with open('models/training_summary.json') as f:
              summary = json.load(f)
          
          test_mae = summary['test_metrics']['MAE']
          test_r2 = summary['test_metrics']['R2']
          
          print(f'Test MAE: \${test_mae:,.0f}')
          print(f'Test R2: {test_r2:.4f}')
          
          # Thresholds for production readiness
          assert test_mae < 20000, f'MAE \${test_mae:,.0f} exceeds threshold \$20,000'
          assert test_r2 > 0.85, f'R2 {test_r2:.4f} below threshold 0.85'
          
          print('✓ Model meets production thresholds')
          "

      - name: Validate fairness thresholds
        run: |
          python -c "
          import json
          with open('models/fairness_audit.json') as f:
              audit = json.load(f)
          
          for attr in ['gender', 'age']:
              dp_diff = audit[f'{attr}_fairlearn']['demographic_parity_difference']
              eo_diff = audit[f'{attr}_fairlearn']['equalized_odds_difference']
              print(f'{attr}: DP Diff={dp_diff:.4f}, EO Diff={eo_diff:.4f}')
              
              # Alert but don't fail for fairness (post-processing can mitigate)
              if abs(dp_diff) > 0.1:
                  print(f'⚠ WARNING: {attr} DP gap > 10%')
              if abs(eo_diff) > 0.1:
                  print(f'⚠ WARNING: {attr} EO gap > 10%')
          
          print('✓ Fairness audit completed')
          "

      - name: Validate conformal coverage
        run: |
          python -c "
          import json
          with open('models/conformal_summary.json') as f:
              summary = json.load(f)
          
          coverage = summary['test_coverage']
          nominal = summary['nominal_coverage']
          gap = abs(coverage - nominal)
          
          print(f'Nominal coverage: {nominal:.0%}')
          print(f'Actual coverage: {coverage:.1%}')
          print(f'Coverage gap: {gap:.1%}')
          
          if gap > 0.15:
              print(f'⚠ WARNING: Coverage gap > 15%')
          
          print('✓ Conformal validation completed')
          "

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [model-validation]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fairpay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          docker run --rm fairpay:${{ github.sha }} python -c "
          import joblib
          model = joblib.load('models/best_model.joblib')
          print(f'Model loaded: {type(model.named_steps[\"model\"]).__name__}')
          "

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # e.g., kubectl apply -f k8s/staging/
          # or flyctl deploy --config fly.staging.toml

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'release'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # e.g., kubectl apply -f k8s/production/
          # or flyctl deploy --config fly.production.toml

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [model-validation, docker-build, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.model-validation.result }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ All checks passed!"
          else
            echo "❌ Some checks failed!"
            exit 1
          fi